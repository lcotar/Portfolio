<section class="navbarResponsiv">
  <!-- Responsive Navbar -->
  <nav class="topnav">
    <!-- Logo links -->
    <div class="navbarRespoLogo">
      <a routerLink="/" fragment="home">
        <img src="/img/logo/LC_Logo_leuchtend.svg" alt="Logo" />
      </a>
    </div>

    <!-- Burger rechts -->
    <button
      class="burgerBTN"
      (click)="toggleMenu()"
      [attr.aria-label]="menuOpen ? 'Menu schliessen' : 'Menu oeffnen'"
      [attr.aria-expanded]="menuOpen"
    >
      {{ menuOpen ? "✕" : "☰" }}
    </button>
  </nav>

  <!-- Overlay -->
  <div class="menuOverlay" *ngIf="menuOpen">
    <div class="menuLinks">
      <a href="#aboutme" (click)="scrollToSection($event, 'aboutme')">{{
        "navbar.aboutMe" | translate
      }}</a>
      <a href="#skills" (click)="scrollToSection($event, 'skills')">{{
        "navbar.skills" | translate
      }}</a>
      <a href="#portfolio" (click)="scrollToSection($event, 'portfolio')">{{
        "navbar.projects" | translate
      }}</a>
      <a href="#contact" (click)="scrollToSection($event, 'contact')">{{
        "navbar.contact" | translate
      }}</a>

      <div class="langSwitch">
        <button
          type="button"
          [class.activeLang]="currentLang === 'en'"
          (click)="toogleTranslation('en')"
        >
          EN
        </button>
        /
        <button
          type="button"
          [class.activeLang]="currentLang === 'de'"
          (click)="toogleTranslation('de')"
        >
          DE
        </button>
      </div>
    </div>
  </div>
</section>
